<svg fill="none" viewBox="0 0 800 300" width="100%" height="300" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes gradientShift {
      0% { stop-color: #0b0f19; }
      50% { stop-color: #1a103c; }
      100% { stop-color: #0b0f19; }
    }
    
    .title-text {
      font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: url(#textGradient);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s ease-out forwards;
    }
    
    .subtitle-text {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 19px;
      font-weight: 600;
      fill: #e2e8f0;
      opacity: 0;
      animation: fadeIn 1.2s ease-out 0.4s forwards;
    }
    
    .detail-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 14px;
      fill: #4fd1c5;
      opacity: 0;
      animation: fadeIn 1.5s ease-out 0.8s forwards;
    }
    
    .tag-container {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      fill: #4a5568;
      opacity: 0;
      animation: fadeIn 2s ease-out 1.2s forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-8px) translateX(4px); }
    }
    
    .floating-dot {
      animation: float 5s ease-in-out infinite;
    }
    .dot-delay-1 { animation-delay: 1.5s; }
    .dot-delay-2 { animation-delay: 3s; }
  </style>

  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#140f28" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2"/>

  <!-- Design Grid Pattern -->
  <g opacity="0.04">
    <path d="M 0,40 L 800,40 M 0,80 L 800,80 M 0,120 L 800,120 M 0,160 L 800,160 M 0,200 L 800,200 M 0,240 L 800,240 M 0,280 L 800,280" stroke="#fff" stroke-width="1.5"/>
    <path d="M 80,0 L 80,300 M 160,0 L 160,300 M 240,0 L 240,300 M 320,0 L 320,300 M 400,0 L 400,300 M 480,0 L 480,300 M 560,0 L 560,300 M 640,0 L 640,300 M 720,0 L 720,300" stroke="#fff" stroke-width="1.5"/>
  </g>

  <!-- Floating Particles -->
  <circle class="floating-dot dot-delay-1" cx="150" cy="70" r="3.5" fill="#a78bfa" opacity="0.6"/>
  <circle class="floating-dot" cx="690" cy="110" r="4.5" fill="#60a5fa" opacity="0.5"/>
  <circle class="floating-dot dot-delay-2" cx="640" cy="220" r="2.5" fill="#34d399" opacity="0.7"/>
  <circle class="floating-dot dot-delay-1" cx="280" cy="230" r="3.5" fill="#f43f5e" opacity="0.4"/>

  <!-- Code Decorators -->
  <g class="tag-container" transform="translate(50, 45)">
    <text>&lt;code&gt;</text>
  </g>
  <g class="tag-container" transform="translate(680, 265)">
    <text>&lt;/code&gt;</text>
  </g>

  <!-- Core Content Group -->
  <g transform="translate(80, 130)">
    <!-- Name -->
    <text class="title-text" x="0" y="0" filter="url(#glow)">ARUN A K</text>
    
    <!-- Subtitle / Role description -->
    <text class="subtitle-text" x="0" y="42">AI/ML Developer &amp; Full-Stack Software Engineer</text>
    
    <!-- Dynamic Terminal-like focus line -->
    <text class="detail-text" x="0" y="80">&gt; Building intelligent agents, scrapers, and deep-dive engines</text>
  </g>
</svg>
